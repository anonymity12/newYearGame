<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守卫年夜饭 - Defend the New Year's Eve Dinner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-container">
            <h1>🧨 守卫年夜饭 🧧</h1>
            <p class="subtitle">合家欢互动小游戏</p>
            <input type="text" id="player-name" placeholder="输入你的名字" maxlength="20">
            <input type="text" id="room-id" placeholder="输入房间号 (例如: 2026)" maxlength="10">
            <button id="join-btn">加入游戏</button>
            <div class="instructions">
                <h3>游戏说明</h3>
                <p>🎆 使用"开运炮仗"炸开障碍物收集资源</p>
                <p>🏮 在聚宝盆中存入红包，建造防御塔</p>
                <p>🐲 阻止小年兽吃掉年夜饭！</p>
            </div>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="game-header">
            <div class="header-left">
                <h2>房间: <span id="current-room"></span></h2>
                <div class="players-list">
                    <h3>玩家列表:</h3>
                    <div id="players-container"></div>
                </div>
            </div>
            <div class="header-center">
                <div class="resource-display">
                    <div class="shared-pool">
                        <h3>🏺 聚宝盆</h3>
                        <div class="resource-item">💰 <span id="shared-coins">0</span> 金币</div>
                    </div>
                </div>
                <div class="wave-info">
                    <span>波次: <span id="wave-number">0</span></span>
                    <button id="start-wave-btn">开始下一波</button>
                </div>
            </div>
            <div class="header-right">
                <div class="tower-controls">
                    <h3>建造防御塔</h3>
                    <button class="tower-btn" data-tower="lantern">
                        🏮 大红灯笼塔<br><small>(20金币)</small>
                    </button>
                    <button class="tower-btn" data-tower="firecracker">
                        🧨 二踢脚发射器<br><small>(30金币)</small>
                    </button>
                </div>
            </div>
        </div>

        <div class="game-container">
            <canvas id="game-canvas"></canvas>
            <div class="controls-hint">
                <p>⌨️ 控制: WASD移动 | 空格键放置炸弹</p>
                <p>🏗️ 点击空地放置防御塔（需先选择塔类型）</p>
            </div>
        </div>

        <div class="game-info">
            <div class="legend">
                <h3>图例</h3>
                <div class="legend-item">🧨 爆竹堆 (可炸)</div>
                <div class="legend-item">📦 年货箱 (可炸)</div>
                <div class="legend-item">❄️ 雪堆 (可炸)</div>
                <div class="legend-item">🍚 年糕 (资源)</div>
                <div class="legend-item">🧧 红包 (入聚宝盆)</div>
                <div class="legend-item">🐟 锦鲤碎片 (资源)</div>
                <div class="legend-item">🍜 年夜饭 (守护目标)</div>
                <div class="legend-item">🐲 小年兽 (敌人)</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
