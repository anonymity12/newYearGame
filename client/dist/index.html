<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>守卫年夜饭 - Defend the New Year's Eve Dinner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 50%, #1a0a0a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      border-radius: 12px;
      box-shadow: 
        0 0 20px rgba(255, 215, 0, 0.3),
        0 0 40px rgba(255, 0, 0, 0.2),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
      border: 4px solid #c9a227;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #8B0000, #DC143C);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-size: 3rem;
      color: #FFD700;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 2rem;
    }

    .loading-bar-container {
      width: 300px;
      height: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #FFD700;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      transition: width 0.3s ease;
    }

    .loading-text {
      color: #fff;
      margin-top: 1rem;
      font-size: 1rem;
    }

    /* Decorative elements */
    .lantern {
      position: fixed;
      width: 60px;
      height: 80px;
      background: radial-gradient(ellipse at center, #ff4d4d, #cc0000);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
      animation: swing 3s ease-in-out infinite;
    }

    .lantern::before {
      content: '福';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFD700;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .lantern:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; }
    .lantern:nth-child(2) { top: 5%; right: 5%; animation-delay: 1s; }

    @keyframes swing {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BtwgdmlD.js"></script>
</head>
<body>
  <div class="lantern"></div>
  <div class="lantern"></div>
  
  <div id="loading-screen">
    <h1 class="loading-title">🧧 守卫年夜饭 🧧</h1>
    <div class="loading-bar-container">
      <div class="loading-bar" id="loading-bar"></div>
    </div>
    <p class="loading-text" id="loading-text">正在加载资源...</p>
  </div>

  <div id="game-container"></div>
  
</body>
</html>
